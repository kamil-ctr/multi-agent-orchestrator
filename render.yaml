# Note: this Blueprint documents the service's intended config, but the
# live service's auto-deploy is actually driven by
# .github/workflows/render-deploy.yml calling a Deploy Hook — Render's
# own GitHub App webhook hasn't synced for this service (see that
# workflow's commit message for the full diagnosis).
services:
  - type: web
    name: multi-agent-orchestrator-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: DATA_DIR
        value: /tmp/data

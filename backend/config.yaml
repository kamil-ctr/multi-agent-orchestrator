# Multi-Agent Orchestration System — configuration
# API keys themselves live in .env, never here.
#
# Only agents confirmed working with the current account keys are listed
# below. claude, openai, deepseek, together, grok, perplexity, and
# huggingface were removed on 2026-07-28 — each either had no key
# configured or failed with an account-side error (insufficient
# credit/balance/quota, or a still-invalid key) even though the
# endpoint/model/auth wiring was verified correct. To bring one back:
# add its API key to .env, then re-add its block here (see git history
# or README for the exact fields) — no code changes needed, the adapter
# classes are untouched in agents/.

defaults:
  timeout_s: 15
  max_retries: 2

cache_ttl_seconds: 3600
judge_agent: gemini          # which agent adjudicates + synthesizes (falls back to heuristic if unavailable)
top_n_for_synthesis: 3        # how many top-scoring responses feed the synthesizer
log_level: INFO
data_dir: data

agents:
  gemini:
    enabled: true
    model: gemini-flash-latest   # gemini-2.5-flash pinned alias is deprecated for new API keys as of this account
    api_key_env: GEMINI_API_KEY
    timeout_s: 15
    max_retries: 2
    price_per_1k_input: 0.0
    price_per_1k_output: 0.0
    supports_vision: true   # gemini-flash-latest handles images natively

  groq:
    enabled: true
    model: llama-3.1-8b-instant
    api_key_env: GROQ_API_KEY
    timeout_s: 10
    max_retries: 2
    price_per_1k_input: 0.0
    price_per_1k_output: 0.0

  cohere:
    enabled: true
    model: command-r-08-2024   # plain "command-r" was retired 2025-09-15
    api_key_env: COHERE_API_KEY
    timeout_s: 15
    max_retries: 2
    price_per_1k_input: 0.0
    price_per_1k_output: 0.0

  mistral:
    enabled: true
    model: mistral-small-latest
    api_key_env: MISTRAL_API_KEY
    timeout_s: 15
    max_retries: 2
    price_per_1k_input: 0.0
    price_per_1k_output: 0.0
